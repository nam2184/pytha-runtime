<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pytha Runtime</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #00ff00;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #app { display: flex; flex: 1; overflow: hidden; }
    #file-panel { width: 200px; background: #1a1a1a; border-right: 1px solid #333; display: flex; flex-direction: column; }
    #file-header { padding: 12px; background: #252525; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    #file-header-title { font-weight: 600; font-size: 12px; text-transform: uppercase; color: #888; }
    #file-header-actions { display: flex; gap: 4px; }
    #file-header-actions button { background: none; border: none; color: #888; cursor: pointer; font-size: 14px; padding: 2px 4px; }
    #file-header-actions button:hover { color: #fff; }
    #file-list { flex: 1; overflow-y: auto; padding: 8px 0; }
    .file-item { padding: 8px 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .file-item:hover { background: #2a2a2a; }
    .file-item.active { background: #0066cc; }
    .file-item-name { font-size: 13px; }
    .file-item-actions { display: none; gap: 4px; }
    .file-item:hover .file-item-actions { display: flex; }
    .file-item-actions button { background: none; border: none; color: #888; cursor: pointer; font-size: 12px; padding: 2px; }
    .file-item-actions button:hover { color: #fff; }
    #editor-panel { width: 40%; display: flex; flex-direction: column; border-right: 1px solid #333; }
    #editor-toolbar { background: #252525; padding: 12px; display: flex; gap: 8px; border-bottom: 1px solid #333; }
    #editor-toolbar button {
      background: #3a3a3a; color: #e0e0e0; border: none; padding: 8px 16px;
      border-radius: 4px; cursor: pointer; font-size: 14px; transition: background 0.2s;
    }
    #editor-toolbar button:hover { background: #4a4a4a; }
    #editor-toolbar button.primary { background: #0066cc; }
    #editor-toolbar button.primary:hover { background: #0077dd; }
    #lua-editor {
      flex: 1; background: #1e1e1e; color: #d4d4d4;
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      font-size: 14px; padding: 16px; border: none; resize: none; outline: none; line-height: 1.5;
    }
    #output-panel { flex: 1; display: flex; flex-direction: column; }
    #three-container { flex: 1; background: #f0f0f0; }
    #log-panel {
      height: 200px; background: #252525; border-top: 1px solid #333;
      overflow-y: auto; font-family: monospace; font-size: 12px; padding: 8px;
    }
    .log-entry { padding: 2px 0; color: #aaa; }
    .log-entry.error { color: #ff6b6b; }
    .log-entry.debug { color: #69dbff; }
    .log-entry.info { color: #69ff69; }
    .pytha-dialog {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: #2a2a2a; border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      min-width: 300px; max-width: 500px; z-index: 1000;
    }
    .pytha-dialog-title { background: #1a1a1a; padding: 12px 16px; border-radius: 8px 8px 0 0; font-weight: 600; }
    .pytha-dialog-content { padding: 16px; }
    .pytha-dialog-footer {
      padding: 12px 16px; border-top: 1px solid #333;
      display: flex; gap: 8px; justify-content: flex-end;
    }
    .pytha-dialog-button { padding: 8px 16px; border-radius: 4px; border: none; cursor: pointer; font-size: 14px; }
    .pytha-dialog-ok { background: #0066cc; color: white; }
    .pytha-dialog-cancel { background: #3a3a3a; color: #e0e0e0; }
    .pytha-control { margin-bottom: 12px; }
    .pytha-input {
      width: 100%; padding: 8px 12px; background: #1a1a1a;
      border: 1px solid #444; border-radius: 4px; color: #e0e0e0; font-size: 14px;
    }
    .pytha-input:focus { outline: none; border-color: #0066cc; }
    .pytha-label { background: #252525; }
    .dialog-input { width: 100%; padding: 8px 12px; background: #1a1a1a; border: 1px solid #444; border-radius: 4px; color: #e0e0e0; font-size: 14px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="file-panel">
      <div id="file-header">
        <span id="file-header-title">Files</span>
        <div id="file-header-actions">
          <button id="add-file-btn" title="New File">+</button>
          <button id="download-zip-btn" title="Download ZIP">⬇</button>
        </div>
      </div>
      <div id="file-list"></div>
    </div>
    <div id="editor-panel">
      <div id="editor-toolbar">
        <select id="sample-select" style="background: #3a3a3a; color: #e0e0e0; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 14px;">
        </select>
        <button class="primary" id="run-btn">Run</button>
        <button id="clear-btn">Clear Scene</button>
        <button id="material-mode-btn">Transparent: Off</button>
      </div>
      <textarea id="lua-editor">-- Pytha Lua Code
function main()
    pyui.alert("Hello from Pytha!")

    local block = pytha.create_block(100, 100, 100, {0, 0, 0})
    pytha.set_element_name(block, "My Block")
end</textarea>
      <div id="log-panel"></div>
    </div>
    <div id="output-panel">
      <div id="three-container"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
